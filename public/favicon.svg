<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Selah">
  <defs>
    <!-- Fondo -->
    <linearGradient id="selah-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151129" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Glow radial cálido -->
    <radialGradient id="selah-glow" cx="50%" cy="68%" r="58%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.65" />
      <stop offset="42%" stop-color="#D18F1E" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#060912" stop-opacity="0" />
    </radialGradient>

    <!-- Llama exterior -->
    <linearGradient id="selah-flame" x1="50%" y1="5%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="45%" stop-color="#F5B544" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Núcleo interior -->
    <linearGradient id="selah-core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A" />
      <stop offset="100%" stop-color="#F5B544" />
    </linearGradient>
  </defs>

  <!-- Fondo rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#selah-bg)" />

  <!-- Glow radial -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#selah-glow)" />

  <!-- Llama exterior: teardrop suave, punta curva, cuerpo bulboso -->
  <path
    d="M32 8
       C 34 15, 45 26, 45 38
       C 45 48, 39.5 55, 32 55
       C 24.5 55, 19 48, 19 38
       C 19 26, 30 15, 32 8 Z"
    fill="url(#selah-flame)"
  />

  <!-- Núcleo interior: gota alargada, más pequeña y desplazada al centro-abajo -->
  <path
    d="M32 27
       C 33.5 33, 36.5 37, 36.5 42.5
       C 36.5 47, 34.5 50, 32 50
       C 29.5 50, 27.5 47, 27.5 42.5
       C 27.5 37, 30.5 33, 32 27 Z"
    fill="url(#selah-core)"
    opacity="0.95"
  />
</svg>